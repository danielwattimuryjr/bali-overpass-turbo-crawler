name: bali-streets

services:
  bali-extract:
    build: ./docker/bali-extract
    environment:
      SOURCE_PBF_URL: ${SOURCE_PBF_URL}
      BALI_RELATION_ID: ${BALI_RELATION_ID:-}
      FORCE_REEXTRACT: ${FORCE_REEXTRACT:-false}
      KEEP_SOURCE: ${KEEP_SOURCE:-false}
      MAX_SOURCE_SIZE_MB: ${MAX_SOURCE_SIZE_MB:-2500}
      MAX_EXTRACT_SIZE_MB: ${MAX_EXTRACT_SIZE_MB:-300}
      ALLOW_ANY_SOURCE: ${ALLOW_ANY_SOURCE:-false}
    volumes:
      - osm-data:/data
    restart: "no"

  overpass:
    image: wiktorn/overpass-api:${OVERPASS_IMAGE_TAG:-latest}
    depends_on:
      bali-extract:
        condition: service_completed_successfully
    environment:
      # Safeguard: the values below are deliberately hardcoded and cannot be changed via .env.
      # Do not switch to clone, set a planet diff, or point the planet URL at the internet.
      OVERPASS_MODE: init
      OVERPASS_META: "no"
      OVERPASS_PLANET_URL: file:///data/bali.osm.bz2
      OVERPASS_USE_AREAS: "true"
      OVERPASS_RULES_LOAD: "10"
      OVERPASS_STOP_AFTER_INIT: "false"
      OVERPASS_MAX_TIMEOUT: "600"
      OVERPASS_SPACE: "4294967296"
    volumes:
      - osm-data:/data:ro
      - overpass-db:/db
    ports:
      - "${OVERPASS_HOST_PORT:-12345}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost/api/status >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30m
    restart: unless-stopped

  crawler:
    build: ./crawler
    profiles: ["crawl"]
    depends_on:
      overpass:
        condition: service_healthy
    env_file: .env
    environment:
      OVERPASS_URL: http://overpass/api/interpreter
      OUTPUT_DIR: /output
    volumes:
      - ./output:/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

volumes:
  osm-data:
  overpass-db:
